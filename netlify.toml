[build]
  command = "npm run build"
  publish = "dist"
  
[build.environment]
  NODE_VERSION = "18"

# 针对public目录下的资源
[[redirects]]
  from = "/public/*"
  to = "/public/:splat"
  status = 200

# SPA应用的重定向规则
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# 设置X-Frame-Options头，允许自己的网站被iframe嵌入
[[headers]]
  for = "/*"
    [headers.values]
    X-Frame-Options = "SAMEORIGIN"
